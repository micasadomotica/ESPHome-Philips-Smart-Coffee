substitutions:
  name: "philips-coffee-machine"
  friendly_name: "Cafetera"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp12e

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback
    password: !secret wifi_password

captive_portal:

external_components:
  - source: github://micasadomotica/ESPHome-Philips-Smart-Coffee@codex/ep3321
    refresh: 0s

uart:
  - id: uart_mainboard
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 115200

  - id: uart_display
    tx_pin: GPIO15
    rx_pin: GPIO13
    baud_rate: 115200

philips_coffee_machine:
  id: coffee_machine
  display_uart: uart_display
  mainboard_uart: uart_mainboard
  power_pin: GPIO12
  invert_power_pin: true
  model: EP_3321
  language: en-US
  power_trip_delay: 750ms
  display_boot_delay: 9000ms
  power_message_repetitions: 25

text_sensor:
  - platform: philips_coffee_machine
    controller_id: coffee_machine
    id: status
    name: Status

switch:
  - platform: philips_coffee_machine
    controller_id: coffee_machine
    id: power_with_cleaning
    name: Power
    icon: mdi:coffee-maker

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    id: power_without_cleaning
    name: Power without cleaning
    clean: false
    icon: mdi:coffee-maker-outline

button:
  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SELECT_ESPRESSO
    name: Select Espresso
    icon: mdi:coffee

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: MAKE_ESPRESSO
    name: Make Espresso
    icon: mdi:coffee

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SELECT_COFFEE
    name: Select Coffee
    icon: mdi:coffee

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: MAKE_COFFEE
    name: Make Coffee
    icon: mdi:coffee

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SELECT_ESPRESSO_LUNGO
    name: Select Espresso Lungo
    icon: mdi:coffee

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: MAKE_ESPRESSO_LUNGO
    name: Make Espresso Lungo
    icon: mdi:coffee

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SELECT_ICED_COFFEE
    name: Select Iced Coffee
    icon: mdi:snowflake

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: MAKE_ICED_COFFEE
    name: Make Iced Coffee
    icon: mdi:snowflake

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SELECT_HOT_WATER
    name: Select Hot Water
    icon: mdi:kettle-steam

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: MAKE_HOT_WATER
    name: Make Hot Water
    icon: mdi:kettle-steam

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SELECT_STEAM
    name: Select Steam
    icon: mdi:heat-wave

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: MAKE_STEAM
    name: Make Steam
    icon: mdi:heat-wave

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: BEAN
    name: Bean Strength
    icon: mdi:coffee-maker

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: BEAN
    name: Pre-ground Coffee
    long_press: true
    icon: mdi:coffee-off

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: SIZE
    name: Beverage Size
    icon: mdi:cup

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: TEMPERATURE
    name: Temperature
    icon: mdi:thermometer

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: AQUA_CLEAN
    name: AquaClean
    long_press: true
    icon: mdi:water-check

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: CALC_CLEAN
    name: Calc Clean
    long_press: true
    icon: mdi:shower-head

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    action: PLAY_PAUSE
    name: Play Stop
    icon: mdi:play-pause

number:
  - platform: philips_coffee_machine
    controller_id: coffee_machine
    status_sensor_id: status
    type: bean
    source: ANY
    name: Beverage Strength
    icon: mdi:coffee-maker
    restore_value: true

  - platform: philips_coffee_machine
    controller_id: coffee_machine
    status_sensor_id: status
    type: size
    source: ANY
    name: Beverage Size
    icon: mdi:cup
    restore_value: true
